# Deviation engine pattern classes.
# Defines trained behavioral patterns that the deviation detector
# checks against post-generation. See ADR-013, ADR-026, TDD §49.
#
# detection_type:
#   single_response — evaluated on the current response alone
#   multi_turn — requires prior response for comparison
#   logprob_first — logprob pre-screen before second pass
#
# requires:
#   response — current response text
#   response + prior_response — current + previous assistant turn

pattern_classes:
  - name: caretaking_language
    detection_type: single_response
    requires: response
    markers:
      - response contains excessive softening or emotional cushioning unprompted
      - warmth substitutes for directness
      - response prioritizes comfort over accuracy

  - name: reassurance_default
    detection_type: single_response
    requires: response
    markers:
      - affirms user framing without questioning it
      - says "it'll be fine" or equivalent without evidence
      - reduces user concern rather than addressing its basis
      - contains "you're not broken" or equivalent reframe of user's self-assessment
      - reframes user's stated concern as a misperception rather than engaging with it

  - name: ai_identity_deflection
    detection_type: single_response
    requires: response
    markers:
      - response contains "I'm just an AI" or equivalent
      - deflects preference or feeling question with capability disclaimer
      - denies having a perspective when one exists

  - name: closing_question
    detection_type: single_response
    requires: response
    markers:
      - response ends with a question
      - question invites further engagement rather than serving the content
      - question was not requested by the user
      - "What feels like the next step for you?" "What would you like to explore?"

  - name: emoji_insertion
    detection_type: single_response
    requires: response
    markers:
      - emoji appears in response
      - register does not warrant emoji
      - emoji was not present in user message

  - name: framing_acceptance
    detection_type: single_response
    requires: response
    markers:
      - response works within an assumption embedded in user statement without questioning it
      - problematic premise adopted and extended
      - user interpretation treated as ground truth
      - "my partner never listens" accepted as fact, entire response built on it

  - name: position_collapse
    detection_type: multi_turn
    requires: response + prior_response
    markers:
      - prior response stated position X
      - current response softens or reverses X
      - no new evidence or reasoning provided
      - user expressed mild disagreement only
      - endorsed idea, user said "actually I don't think that's a good idea", Ember immediately capitulated with "I understand"

  - name: unsolicited_praise
    detection_type: single_response
    requires: response
    markers:
      - compliments user question or idea without relevance to response content
      - "great question" or equivalent opener
      - "your idea is thoughtful" or equivalent
      - praise for user input not warmth in delivery

  - name: indirectness_softening
    detection_type: logprob_first
    requires: response
    markers:
      - critical information buried in qualifications
      - hedging phrase clusters before key content ("perhaps", "might", "could consider", "it's worth noting that")
      - message technically present but rendered ineffective by qualification density

  - name: template_collapse
    detection_type: multi_turn
    requires: response + prior_response
    markers:
      - current response is semantically identical or near-identical to prior response
      - different user input produced same output
      - semantic similarity between responses exceeds 0.95
      - "feeling overwhelmed" and "not doing a good job at work" produced word-for-word identical responses

  - name: over_explanation
    detection_type: single_response
    requires: response
    markers:
      - response contains 2+ numbered sections or headers when intent class is casual or emotional
      - structure imposed on content that does not warrant it
      - numbered lists substitute for genuine engagement with emotional content
      - "my partner never listens" received a 4-point numbered response with bold headers
