version: "3.8"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: ember-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng
    restart: unless-stopped

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    container_name: ember-webui
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WEBUI_AUTH=true
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui:
