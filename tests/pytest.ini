[pytest]
testpaths = tests
python_files = test_*.py
addopts = -m "not eval and not live_ollama"
markers =
    eval: Tier 3/4 evals; may need live Ollama and the Anthropic API. The Ollama guard stands down for them (tests/ollama_guard.py). Run explicitly with: pytest tests/eval/ -m eval
    docker_probe: runs the real SearXNG health probe (src.api.main._check_docker_status); without it conftest stubs the probe