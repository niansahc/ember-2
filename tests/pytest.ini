[pytest]
testpaths = tests
python_files = test_*.py
addopts = -m "not eval and not live_ollama"
markers =
    live_ollama: reaches a running Ollama (real embeddings or model); deselected by default, run with: pytest tests/ -m live_ollama. Every other test has Ollama stubbed and fails if it connects to port 11434 (tests/ollama_guard.py)
    eval: Tier 4 conversation quality eval — requires live Ollama and Anthropic API. Run explicitly with: pytest tests/eval/ -m eval
    docker_probe: runs the real SearXNG health probe (src.api.main._check_docker_status); without it conftest stubs the probe