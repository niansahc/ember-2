[pytest]
testpaths = tests
python_files = test_*.py
addopts = -m "not eval"
markers =
    eval: Tier 4 conversation quality eval — requires live Ollama and Anthropic API. Run explicitly with: pytest tests/eval/ -m eval
    docker_probe: runs the real SearXNG health probe (src.api.main._check_docker_status); without it conftest stubs the probe